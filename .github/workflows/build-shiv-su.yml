name: Build SHIV-SU DirtyFrag 1.08 compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: userspace/ksud
          cache-targets: false
          cache-on-failure: true
      - name: Restore matching original SHIV-SU payloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/manager
          gh run download 39347865569 --repo "$GITHUB_REPOSITORY" --pattern 'aarch64-*-lkm' --pattern ksuinit-aarch64 --dir artifacts
          gh run download 39348808817 --repo "$GITHUB_REPOSITORY" --name SHIV-SU-APK --dir artifacts/manager
          cp artifacts/aarch64-*-lkm/*_kernelsu.ko userspace/ksud/bin/aarch64/
          cp artifacts/ksuinit-aarch64/ksuinit userspace/ksud/bin/aarch64/
          curl --fail --location --retry 3 https://github.com/mitschud/DirtyFrag/releases/download/v1.08/DirtyFrag-v1.08.apk -o artifacts/DirtyFrag.apk
          echo 'cf44c1ea9225ad47ccb100f6f5c7bdba3852436d807d3d9300673e19419596de  artifacts/DirtyFrag.apk' | sha256sum -c -
      - name: Set up Android Rust tooling
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          rustup update stable
          rustup target add aarch64-linux-android
          curl --fail --location --retry 3 https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-gnu-v4.1.2.tgz -o /tmp/cargo-ndk.tgz
          echo '9451622c4567e8abb2c8005001855e32901c0b716ccdd3a173a4375fd03426e1  /tmp/cargo-ndk.tgz' | sha256sum -c -
          mkdir -p /tmp/cargo-ndk-bin
          tar -xzf /tmp/cargo-ndk.tgz -C /tmp/cargo-ndk-bin
          find /tmp/cargo-ndk-bin -type f -name 'cargo-ndk*' -executable -exec cp {} "$HOME/.cargo/bin/" \;
          echo CARGO_NDK_PLATFORM=26 >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
      - name: Android compilation check
        working-directory: userspace/ksud
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a check
      - name: Android clippy
        working-directory: userspace/ksud
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a clippy
      - name: Format Rust
        working-directory: userspace/ksud
        run: cargo fmt
      - name: Build compatible daemon
        working-directory: userspace/ksud
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a build --release
      - name: Prepare APKs retaining the original applications
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          mkdir output
          cp target/aarch64-linux-android/release/ksud output/ksud
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" output/ksud
          python3 scripts/package_native_compat.py
      - name: Sign and verify v2-only APKs
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE" | base64 -d > key.jks
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          for name in SHIV-SU-updated DirtyFrag-1.08-for-SHIV-SU; do
            "$tools/zipalign" -f -P 16 4 "output/$name-unsigned.apk" aligned.apk
            "$tools/apksigner" sign --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled false --v4-signing-enabled false --ks key.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASS --key-pass env:KEY_PASS --out "output/$name.apk" aligned.apk
            "$tools/apksigner" verify --verbose --print-certs "output/$name.apk"
            "$tools/zipalign" -c -P 16 4 "output/$name.apk"
            "$tools/aapt2" dump badging "output/$name.apk" > "output/$name.badging.txt"
            rm "output/$name-unsigned.apk"
          done
          grep -F "application-label:'SHIV-SU'" output/SHIV-SU-updated.badging.txt
          sha256sum output/*.apk output/ksud > output/SHA256SUMS.txt
          mkdir -p output/source
          cp userspace/ksud/src/{cli,late_load,utils}.rs output/source/
      - uses: actions/upload-artifact@v7
        with:
          name: SHIV-SU-native-DirtyFrag-compat
          path: output/
