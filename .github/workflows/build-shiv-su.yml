name: Sign supplied APK customizations
on:
  workflow_dispatch:
    inputs:
      staging_tag:
        required: true
        type: string
permissions:
  contents: read
jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Download prepared APKs from draft staging release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.staging_tag }}
        run: |
          mkdir input output
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-unsigned.apk' --dir input
      - name: Sign and verify original-version APKs
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE" | base64 -d > key.jks
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          for pair in SHIV-SU-supplied-unsigned.apk:SHIV-SU-from-your-KernelSU.apk DirtyFrag-1.08-matching-unsigned.apk:DirtyFrag-1.08-for-SHIV-SU.apk; do
            src="${pair%%:*}"
            dst="${pair#*:}"
            "$tools/zipalign" -f -P 16 4 "input/$src" aligned.apk
            "$tools/apksigner" sign --ks key.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASS --key-pass env:KEY_PASS --out "output/$dst" aligned.apk
            "$tools/apksigner" verify --verbose --print-certs "output/$dst"
            "$tools/zipalign" -c -P 16 4 "output/$dst"
            "$tools/aapt2" dump badging "output/$dst" > "output/$dst.badging.txt"
          done
          grep -F "application-label:'SHIV-SU '" output/SHIV-SU-from-your-KernelSU.apk.badging.txt
          sha256sum output/*.apk > output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: SHIV-SU-your-exact-APKs
          path: output/
