name: Build SHIV-SU compatible base
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  generate-key:
    runs-on: ubuntu-latest
    outputs:
      expected_size: ${{ steps.extract.outputs.expected_size }}
      expected_hash: ${{ steps.extract.outputs.expected_hash }}
      keystore: ${{ steps.gen.outputs.keystore }}
      keystore_password: ${{ steps.gen.outputs.keystore_password }}
      key_password: ${{ steps.gen.outputs.key_password }}
    steps:
      - name: Generate temporary keystore
        if: github.event_name == 'pull_request'
        id: gen
        run: |
          KEYSTORE_PASSWORD=$(openssl rand -hex 32)
          KEY_PASSWORD=$(openssl rand -hex 32)
          echo "keystore_password=$KEYSTORE_PASSWORD" >> $GITHUB_OUTPUT
          echo "key_password=$KEY_PASSWORD" >> $GITHUB_OUTPUT

          keytool -genkeypair \
            -alias pr-key \
            -keyalg RSA -keysize 2048 \
            -validity 1 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=KernelSU PR Build" \
            -storetype JKS \
            -keystore pr-key.jks

          echo "keystore=$(base64 -w 0 pr-key.jks)" >> $GITHUB_OUTPUT

      - name: Prepare repository signing certificate
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          test -n "$KEYSTORE"
          echo "$KEYSTORE" | base64 -d > pr-key.jks

      - name: Extract certificate hash and size
        id: extract
        env:
          STORE_PASS: ${{ steps.gen.outputs.keystore_password || secrets.KEYSTORE_PASSWORD }}
          CERT_ALIAS: ${{ github.event_name == 'pull_request' && 'pr-key' || secrets.KEY_ALIAS }}
        run: |
          # Export DER certificate
          keytool -exportcert \
            -alias "$CERT_ALIAS" \
            -keystore pr-key.jks \
            -storepass "$STORE_PASS" \
            -file pr-cert.der

          # Calculate size in hex
          SIZE_DEC=$(stat -c%s pr-cert.der)
          SIZE_HEX=$(printf '0x%04x' "$SIZE_DEC")
          echo "expected_size=$SIZE_HEX" >> $GITHUB_OUTPUT

          # Calculate SHA256 hash
          HASH=$(sha256sum pr-cert.der | awk '{print $1}')
          echo "expected_hash=$HASH" >> $GITHUB_OUTPUT

          echo "Certificate size: $SIZE_HEX ($SIZE_DEC bytes)"
          echo "Certificate hash: $HASH"

  build-lkm:
    needs: generate-key
    uses: ./.github/workflows/build-lkm.yml
    with:
      expected_size: ${{ needs.generate-key.outputs.expected_size }}
      expected_hash: ${{ needs.generate-key.outputs.expected_hash }}
    secrets: inherit
  build-ksuinit:
    uses: ./.github/workflows/ksuinit.yml
  build-ksud:
    needs: [build-lkm, build-ksuinit]
    strategy:
      matrix:
        target: [aarch64-linux-android, x86_64-linux-android, riscv64-linux-android]
    uses: ./.github/workflows/ksud.yml
    with:
      target: ${{ matrix.target }}
      pack_lkm: true
      pack_ksuinit: true
  build-apk:
    needs: build-ksud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Download matching Android daemons
        uses: actions/download-artifact@v8
        with:
          pattern: ksud-*-linux-android
          path: artifacts

      - name: Install daemons before Gradle
        run: |
          for pair in arm64-v8a:aarch64-linux-android x86_64:x86_64-linux-android riscv64:riscv64-linux-android; do
            abi="${pair%%:*}"
            target="${pair#*:}"
            mkdir -p "manager/app/src/main/jniLibs/$abi" "target/$target/release"
            cp "artifacts/ksud-$target/ksud" "manager/app/src/main/jniLibs/$abi/libksud.so"
            cp "artifacts/ksud-$target/ksud" "target/$target/release/ksud"
          done

      - name: Prepare persistent signing identity
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE" | base64 -d > manager/key.jks
          {
            echo "KEYSTORE_FILE=key.jks"
            echo "KEYSTORE_PASSWORD=$STORE_PASS"
            echo "KEY_PASSWORD=$KEY_PASS"
            echo "KEY_ALIAS=$KEY_ALIAS"
          } >> manager/gradle.properties

      - name: Build SHIV-SU release APK
        working-directory: manager
        run: ./gradlew clean assembleRelease

      - name: Repack matching daemons and sign final APK
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 repack_apk.py repack -b release -t release \
            -a arm64-v8a -a x86_64 -a riscv64 \
            -K manager/key.jks -A "$KEY_ALIAS" \
            -P "$STORE_PASS" -S "$KEY_PASS" --strip
          apk=$(find dist -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          mv "$apk" dist/SHIV-SU-DirtyFrag-compat.apk

      - name: Verify APK signature and label
        run: |
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$tools/apksigner" verify --verbose --print-certs dist/SHIV-SU-DirtyFrag-compat.apk
          "$tools/aapt2" dump badging dist/SHIV-SU-DirtyFrag-compat.apk > /tmp/apk-badging.txt
          grep -F "application-label:'SHIV-SU'" /tmp/apk-badging.txt
          sha256sum dist/SHIV-SU-DirtyFrag-compat.apk > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: SHIV-SU-compat-APK
          path: |
            dist/SHIV-SU-DirtyFrag-compat.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
