name: Build SHIV TEST APK and all LKM
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  certificate:
    runs-on: ubuntu-latest
    outputs:
      size: ${{ steps.cert.outputs.size }}
      hash: ${{ steps.cert.outputs.hash }}
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Export signing certificate
        id: cert
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          CERT_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 -d > signing.p12
          keytool -exportcert -alias "$CERT_ALIAS" -keystore signing.p12 -storepass:env STORE_PASS -file manager-cert.der
          printf 'size=0x%04x\n' "$(stat -c%s manager-cert.der)" >> "$GITHUB_OUTPUT"
          echo "hash=$(sha256sum manager-cert.der | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          rm signing.p12
      - uses: actions/upload-artifact@v7
        with:
          name: manager-certificate
          path: manager-cert.der
  build-lkm:
    needs: certificate
    uses: ./.github/workflows/build-lkm.yml
    with:
      expected_size2: ${{ needs.certificate.outputs.size }}
      expected_hash2: ${{ needs.certificate.outputs.hash }}
  build-ksuinit:
    uses: ./.github/workflows/ksuinit.yml
  build-ksud:
    needs: [build-lkm, build-ksuinit]
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, x86_64-linux-android]
    uses: ./.github/workflows/ksud.yml
    with:
      target: ${{ matrix.target }}
      pack_lkm: true
      pack_ksuinit: true
  build-ksud-extra:
    needs: [build-lkm, build-ksuinit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
    uses: ./.github/workflows/ksud-extra.yml
    with:
      target: ${{ matrix.target }}
      os: ${{ matrix.os }}
      pack_lkm: true
      pack_ksuinit: true
  manager:
    needs: [build-ksud, certificate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: ksud-*-linux-android
          path: artifacts
      - name: Install freshly built daemons before Gradle
        run: |
          for pair in arm64-v8a:aarch64-linux-android x86_64:x86_64-linux-android; do
            abi="${pair%%:*}"
            target="${pair#*:}"
            mkdir -p "manager/app/src/main/jniLibs/$abi" "target/$target/release"
            cp "artifacts/ksud-$target/ksud" "manager/app/src/main/jniLibs/$abi/libksud.so"
            cp "artifacts/ksud-$target/ksud" "target/$target/release/ksud"
          done
      - name: Prepare signing
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          CERT_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE" | base64 -d > manager/key.jks
          {
            echo 'KEYSTORE_FILE=key.jks'
            echo "KEYSTORE_PASSWORD=$STORE_PASS"
            echo "KEY_PASSWORD=$KEY_PASS"
            echo "KEY_ALIAS=$CERT_ALIAS"
          } >> manager/gradle.properties
      - name: Build release APK
        working-directory: manager
        run: ./gradlew clean assembleRelease
      - name: Repack and sign final APK
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          CERT_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 repack_apk.py repack -b release -t release -a arm64-v8a -a x86_64 -K manager/key.jks -A "$CERT_ALIAS" -P "$STORE_PASS" -S "$KEY_PASS" --strip
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs dist/*.apk
      - uses: actions/upload-artifact@v7
        with:
          name: SHIV-TEST-APK
          path: dist/*.apk
          if-no-files-found: error
  bundle:
    needs: [manager, build-ksud-extra]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Verify all drivers and create checksums
        run: python3 scripts/verify_shiv_bundle.py artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: SHIV-TEST-FULL-BUNDLE
          path: artifacts/
          if-no-files-found: error
